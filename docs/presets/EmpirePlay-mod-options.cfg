# Mod options the EmpirePlay sandbox preset needs. tools/ready-to-play.ps1 writes these into
# Sandbox Presets\EmpirePlay.cfg (adds a missing key, fixes a changed value, leaves everything else alone).

# NPC Crew: the Bandits mod spawns no hostile groups at all (assault waves, roadblocks, camps, house defenders).
# Friendly clans and your own crew keep arriving. Keys read from NPC Crew's own sandbox-options.txt.
BanditsNPC.NoHostileBandits=true

# NPC Crew: most companions one player can have. The beacon stages unlock a quarter, half, then all of this.
# NPC cost grows with how many are active, so it starts at 12 (the mod default is 30). Raise it once the frame rate is known.
BanditsNPC.MaxCrewPerPlayer=12

# Evolving Traits World: no traits gained or lost on their own during play (character stays as built).
EvolvingTraitsWorld.DisableAllDynamicTraits=true

# --- Realism and crafting (27 Nov 2026, King: loot respawn is not realistic; ammo must be craftable from found things) ---
# Plain vanilla sandbox keys, same replace-or-append rule. Loot scale: 0.05 insane, 0.2 extreme, 0.6 rare, 1.0 normal, 2.0 common, 3.0 abundant.

# Shelves stay empty once looted: no loot respawn at all (the preset had it on, 200 hours).
HoursForLootRespawn=0

# Ready-made ammo and guns are rare finds. Ammo comes from crafting (see docs/PLAY-READY.md).
AmmoLootNew=0.6
RangedWeaponLootNew=0.6

# Crafting is the main loop, so the things recipes need are not scarce: tools and recipe parts back to normal.
ToolLootNew=1.0
RecipeResourceLoot=1.0
