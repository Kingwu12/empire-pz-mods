# Mod options the EmpirePlay sandbox preset needs. tools/ready-to-play.ps1 writes these into
# Sandbox Presets\EmpirePlay.cfg (adds a missing key, fixes a changed value, leaves everything else alone).

# NPC Crew: the Bandits mod spawns no hostile groups at all (assault waves, roadblocks, camps, house defenders).
# Friendly clans and your own crew keep arriving. Keys read from NPC Crew's own sandbox-options.txt.
BanditsNPC.NoHostileBandits=true

# NPC Crew: most companions one player can have. The beacon stages unlock a quarter, half, then all of this.
# NPC cost grows with how many are active, so it starts at 12 (the mod default is 30). Raise it once the frame rate is known.
BanditsNPC.MaxCrewPerPlayer=12

# Evolving Traits World: no traits gained or lost on their own during play (character stays as built).
EvolvingTraitsWorld.DisableAllDynamicTraits=true

# --- Realism and crafting (27 Nov 2026, King: loot respawn is not realistic; ammo must be craftable from found things) ---
# Plain vanilla sandbox keys, same replace-or-append rule. Loot scale: 0.05 insane, 0.2 extreme, 0.6 rare, 1.0 normal, 2.0 common, 3.0 abundant.

# Shelves stay empty once looted: no loot respawn at all (the preset had it on, 200 hours).
HoursForLootRespawn=0

# Ammo and guns at the NORMAL dial (1.0). Scarcity comes from WHERE things are, not from a global squeeze: the Empire Stockpiles mod
# (this repo) piles ammo and guns into gun stores, police armories, army storage and the port cargo, so those places stay rich while a
# random house or shop shelf stays tight. Ammo Maker covers the long run (see docs/PLAY-READY.md).
AmmoLootNew=1.0
RangedWeaponLootNew=1.0

# Crafting is the main loop, so the things recipes need are not scarce: tools and recipe parts back to normal.
ToolLootNew=1.0
RecipeResourceLoot=1.0

# --- Zombie drops, realistic (27 Nov 2026, King: "zombies or people before carry ammo and things... we just need a realistic statistic") ---
# Ammo Loot Drop for Guns of 93 (Workshop 3404184088). Its default drops ammo from about 55 percent of ALL bodies. ArmedZombiesOnly limits drops to
# the 41 outfits that plausibly carried a gun (soldiers, militia, police, guards, hunters, farmers, bikers...), about 1 zombie in 100 in a normal town,
# and gives each one only calibres that fit its gun. So ammo, magazines and guns come from police stations, army bases, prisons and farms.
# Rates are chances per body of an armed outfit (checked twice per body): rounds 4 = about 55 to 80 percent carry some, a magazine 15 = about 28 percent,
# a sidearm 10 = about 19 percent. Tune these after the first police station.
AmmoLootDropGuns93B42.ArmedZombiesOnly=true
AmmoLootDropGuns93B42.DropRate=4.0
AmmoLootDropGuns93B42.LooseRoundsMax=15
AmmoLootDropGuns93B42Magazine.ArmedZombiesOnly=true
AmmoLootDropGuns93B42Magazine.DropRate=15.0
AmmoLootDropGuns93B42Weapon.ArmedZombiesOnly=true
AmmoLootDropGuns93B42Weapon.DropRate=10.0
